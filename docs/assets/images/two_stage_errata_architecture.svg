<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .main-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .main-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748B; }
      .col-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }
      .card-header { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .card-body { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 9.5px; fill: #334155; }
      .card-meta { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; fill: #64748B; }
      .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 600; fill: #0284C7; }
      .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 700; fill: #FFFFFF; }
    </style>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="440" class="bg"/>

  <!-- Master Header Banner -->
  <rect x="16" y="12" width="888" height="46" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="32" y="32" class="main-title">Two-Stage Air-Gapped Errata Remediation Architecture</text>
  <text x="32" y="48" class="main-sub">Strict Operational Decoupling: Controller Package Staging (Stage 1) vs. Rolling Cluster Remediation (Stage 2) • Rule 32.21 &amp; Rule 32.36</text>

  <!-- ================= STAGE 1 COLUMN (Left) ================= -->
  <g transform="translate(16, 68)">
    <!-- Column Container -->
    <rect width="436" height="356" rx="8" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.5"/>

    <!-- Column Header -->
    <rect width="436" height="36" rx="8" fill="#EFF6FF"/>
    <rect y="26" width="436" height="10" fill="#EFF6FF"/>
    <line x1="0" y1="36" x2="436" y2="36" stroke="#BFDBFE" stroke-width="1"/>

    <text x="14" y="22.5" class="col-title" fill="#1D4ED8">STAGE 1: CONTROLLER STAGING &amp; REPO</text>

    <!-- Stage 1 Status Badge -->
    <rect x="300" y="9" width="124" height="18" rx="9" fill="#2563EB"/>
    <text x="362" y="21.5" class="badge-text" text-anchor="middle">PREPARATION / SAFE</text>

    <!-- Card 1.1: Upstream Source -->
    <g transform="translate(18, 48)">
      <rect width="400" height="66" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
      <rect width="4" height="66" rx="2" fill="#0284C7"/>
      <text x="16" y="20" class="card-header" fill="#0F172A">1.1 Source Ingestion &amp; Harvesting</text>
      <text x="16" y="38" class="card-body">Option A: Red Hat Satellite / Capsule Mirror</text>
      <text x="16" y="52" class="card-body">Option B: Quarterly Errata ISO (BaseOS + AppStream)</text>
    </g>

    <!-- Flow Down 1 -->
    <path d="M 218 114 L 218 136" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowBlue)" fill="none"/>
    <text x="226" y="128" class="flow-label">Harvest Target RPMs</text>

    <!-- Card 1.2: Controller Staging Space -->
    <g transform="translate(18, 140)">
      <rect width="400" height="74" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
      <rect width="4" height="74" rx="2" fill="#2563EB"/>
      <text x="16" y="20" class="card-header" fill="#1D4ED8">1.2 Sovereign Controller Staging (Rule 32.21)</text>
      <text x="16" y="38" class="card-body">Path: ~/offline-repos/malaysia/rhel8-security-errata/</text>
      <text x="16" y="52" class="card-body">Hosts: mno-dc1-prod-ctl (192.0.2.110) | mno-dc2-prod-ctl (192.0.2.100)</text>
      <text x="16" y="66" class="card-meta">Mandate: Centralized staging strictly on controllers; no manual node copies</text>
    </g>

    <!-- Flow Down 2 -->
    <path d="M 218 214 L 218 236" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowBlue)" fill="none"/>
    <text x="226" y="228" class="flow-label">Index &amp; Verify</text>

    <!-- Card 1.3: Repodata & Verification -->
    <g transform="translate(18, 240)">
      <rect width="400" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
      <rect width="4" height="96" rx="2" fill="#16A34A"/>
      <text x="16" y="20" class="card-header" fill="#15803D">1.3 Metadata Synthesis &amp; Pre-Flight Gate</text>
      <text x="16" y="38" class="card-body">Command: createrepo_c --update &lt;repo-path&gt;</text>
      <text x="16" y="52" class="card-body">Integrity: uv run python verify_stage1_repo.py</text>
      <text x="16" y="68" class="card-body">Manifest: 119 RPM Targets Reconciled via OVAL</text>
      <text x="16" y="84" class="card-meta">Output: repodata/repomd.xml generated &amp; verified</text>
    </g>
  </g>

  <!-- ================= STAGE 2 COLUMN (Right) ================= -->
  <g transform="translate(468, 68)">
    <!-- Column Container -->
    <rect width="436" height="356" rx="8" fill="#F8FAFC" stroke="#FCA5A5" stroke-width="1.5"/>

    <!-- Column Header -->
    <rect width="436" height="36" rx="8" fill="#FEF2F2"/>
    <rect y="26" width="436" height="10" fill="#FEF2F2"/>
    <line x1="0" y1="36" x2="436" y2="36" stroke="#FECACA" stroke-width="1"/>

    <text x="14" y="22.5" class="col-title" fill="#B91C1C">STAGE 2: NODE-BY-NODE ROLLING UPDATE</text>

    <!-- Stage 2 Status Badge -->
    <rect x="286" y="9" width="138" height="18" rx="9" fill="#DC2626"/>
    <text x="355" y="21.5" class="badge-text" text-anchor="middle">HUMAN-COMMANDED ONLY</text>

    <!-- Card 2.1: Transport & Registration -->
    <g transform="translate(18, 48)">
      <rect width="400" height="66" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
      <rect width="4" height="66" rx="2" fill="#EA580C"/>
      <text x="16" y="20" class="card-header" fill="#C2410C">2.1 Automated Resilient Transport</text>
      <text x="16" y="38" class="card-body">Sync: ansible.posix.synchronize (Chunked rsync)</text>
      <text x="16" y="52" class="card-body">Target Repo: /var/tmp/rhel8-security-errata (file://)</text>
    </g>

    <!-- Flow Down 3 -->
    <path d="M 218 114 L 218 136" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)" fill="none"/>
    <text x="226" y="128" class="flow-label" fill="#D97706">Isolate Repos</text>

    <!-- Card 2.2: DNF Upgrade Execution -->
    <g transform="translate(18, 140)">
      <rect width="400" height="74" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
      <rect width="4" height="74" rx="2" fill="#DC2626"/>
      <text x="16" y="20" class="card-header" fill="#B91C1C">2.2 Air-Gapped DNF Package Upgrade</text>
      <text x="16" y="38" class="card-body">Flags: disablerepo="*" --enablerepo="rhel8-airgap-errata"</text>
      <text x="16" y="52" class="card-body">Plugin Guard: disable_plugin=subscription-manager</text>
      <text x="16" y="66" class="card-meta">Resolves: Kernel, openssl, glibc, runc, container-selinux</text>
    </g>

    <!-- Flow Down 4 -->
    <path d="M 218 214 L 218 236" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)" fill="none"/>
    <text x="226" y="228" class="flow-label" fill="#D97706">Rolling Reboot</text>

    <!-- Card 2.3: Verification & Service Checks -->
    <g transform="translate(18, 240)">
      <rect width="400" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
      <rect width="4" height="96" rx="2" fill="#4B5563"/>
      <text x="16" y="20" class="card-header" fill="#1F2937">2.3 Sequential Reboot &amp; Health Verification</text>
      <text x="16" y="38" class="card-body">Discipline: Node-by-node rolling execution (serial: 1)</text>
      <text x="16" y="52" class="card-body">Kernel Check: needs-restarting -r / reboot if required</text>
      <text x="16" y="68" class="card-body">Port Assertions: Port 22/SSH, Patroni 5432, CBC 8080/8010</text>
      <text x="16" y="84" class="card-meta">Cluster Guard: Zero downtime across PWP HA and CBC daemons</text>
    </g>
  </g>

  <!-- Mid-Line Boundary (Rule 32.36 Role Separation) -->
  <line x1="460" y1="76" x2="460" y2="416" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>

</svg>
