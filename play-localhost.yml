---
- name: Run localhost ASIMP Security Hardening and Audits
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  vars:
    security_enable_firewalld: false
    security_contrib_enabled: true
    security_rhel7_audit_failure_flag: 1
    security_ntp_servers:
      - ntp1.sirim.my
      - ntp2.sirim.my
    ssh_kex:
      - curve25519-sha256@libssh.org
      - diffie-hellman-group-exchange-sha256
  tasks:
    - name: Detect if running in Google Jules Sandbox
      ansible.builtin.stat:
        path: /home/jules
      register: jules_home_stat

    - name: Set sandbox fact
      ansible.builtin.set_fact:
        is_sandbox_jules: "{{ jules_home_stat.stat.exists }}"
        security_rhel7_initialize_aide: "{{ not jules_home_stat.stat.exists }}"

    - name: Test write access - Create temporary file in /etc
      ansible.builtin.tempfile:
        state: file
        path: /etc
        suffix: _asimp_write_test
      register: r_write_tempfile
      failed_when: false
      ignore_errors: true

    - name: Set dynamic privilege level and execution mode
      ansible.builtin.set_fact:
        asimp_privilege_level: "{{ 'limited' if (is_sandbox_jules | default(false) | bool or r_write_tempfile.path is not defined or r_write_tempfile.path | length == 0) else 'full' }}"

    - name: Test write access - Clean up temporary file
      ansible.builtin.file:
        path: "{{ r_write_tempfile.path }}"
        state: absent
      when: r_write_tempfile.path is defined and r_write_tempfile.path | length > 0
      ignore_errors: true

    - name: Dynamically patch external roles for sandbox compatibility
      ansible.builtin.command: python3 scripts/patch_roles.py
      register: patch_roles_result
      changed_when: "'Patched ' in patch_roles_result.stdout"
      delegate_to: localhost
      run_once: true
      ignore_errors: true
      tags: always

    - name: Patch lynis-ansible tasks to use include_tasks on-the-fly
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^(\s*)include:'
        replace: '\1ansible.builtin.include_tasks:'
      loop:
        - "roles/lynis-ansible/tasks/main.yml"
        - "roles/linuxmalaysia.lynis_ansible/tasks/main.yml"
        - "{{ lookup('env', 'HOME') }}/.ansible/roles/linuxmalaysia.lynis_ansible/tasks/main.yml"
        - "/usr/share/ansible/roles/linuxmalaysia.lynis_ansible/tasks/main.yml"
        - "/etc/ansible/roles/linuxmalaysia.lynis_ansible/tasks/main.yml"
      delegate_to: localhost
      run_once: true
      ignore_errors: true
      tags: always

    - name: Run BEFORE Hardening Audits (OpenSCAP & Lynis)
      block:
        - name: Run BEFORE Hardening Audits (OpenSCAP & Lynis)
          ansible.builtin.include_role:
            name: reporting-ASIMP
          vars:
            reporting_phase: before
      become: "{{ asimp_privilege_level == 'full' }}"

    - name: Pre-Remediation Safety Check & Break-Prevention Verification
      block:
        - name: Safety Check | Check SSH daemon configuration syntax
          ansible.builtin.command: sshd -t
          register: sshd_syntax_check
          changed_when: false
          failed_when: false
          ignore_errors: true
          become: true

        - name: Safety Check | Fail if SSH daemon configuration is already broken
          ansible.builtin.fail:
            msg: "CRITICAL: The existing SSH configuration has syntax errors! Remediation cannot proceed safely to prevent system lockout."
          when: sshd_syntax_check.rc | default(0) != 0

        - name: Safety Check | Check free disk space on root partition (/)
          ansible.builtin.shell: df / --output=avail | tail -n1
          register: free_space_root
          changed_when: false
          failed_when: false
          ignore_errors: true

        - name: Safety Check | Assert enough disk space is available (min 512MB / 524288 KB)
          ansible.builtin.assert:
            that:
              - (free_space_root.stdout | trim | int) > 524288
            fail_msg: "CRITICAL: Insufficient disk space on root partition (less than 512MB free). Upgrading or hardening may break the system."
          when: free_space_root.rc | default(1) == 0

        - name: Safety Check | Validate /etc/fstab mount points
          ansible.builtin.command: mount -a -f
          register: fstab_check
          changed_when: false
          failed_when: false
          ignore_errors: true
          become: true

        - name: Safety Check | Fail if mount points or fstab are corrupted
          ansible.builtin.fail:
            msg: "CRITICAL: /etc/fstab has invalid mount points! Proceeding with remediation could break system boot capability."
          when: fstab_check.rc | default(0) != 0

        - name: Safety Check | Check if SSH port is active and reachable
          ansible.builtin.wait_for:
            port: "{{ ansible_port | default(22) }}"
            timeout: 5
            state: started

        - name: Safety Check | Log active system port baseline
          ansible.builtin.debug:
            msg: "Pre-flight Safety Check Passed! SSH Port {{ ansible_port | default(22) }} is active. Storage and SSHD syntax are healthy."
      when: asimp_privilege_level == 'full'

    - name: Apply Ubuntu Update Hardening
      block:
        - name: Apply Ubuntu Update Hardening
          ansible.builtin.include_role:
            name: update-ubuntu-ASIMP
          vars:
            upgrade_ubuntu_check: "{{ not is_sandbox_jules }}"
            dist_upgrade_ubuntu_check: "{{ not is_sandbox_jules }}"
            safe_upgrade_ubuntu_check: "{{ not is_sandbox_jules }}"
            debsums_ubuntu_check: "{{ not is_sandbox_jules }}"
      when:
        - (ansible_distribution == 'Ubuntu' or ansible_os_family == 'Debian')
        - asimp_privilege_level == 'full'
      become: true

    - name: Apply RedHat Update Hardening
      block:
        - name: Apply RedHat Update Hardening
          ansible.builtin.include_role:
            name: update-ubuntu-ASIMP
          vars:
            upgrade_rhel_check: "{{ not is_sandbox_jules }}"
            rpmsums_check: "{{ not is_sandbox_jules }}"
      when:
        - (ansible_os_family == 'RedHat')
        - asimp_privilege_level == 'full'
      become: true

    - name: Apply OpenStack System Hardening
      block:
        - name: Apply OpenStack System Hardening
          ansible.builtin.include_role:
            name: ansible-hardening
      ignore_errors: "{{ is_sandbox_jules }}"
      when: asimp_privilege_level == 'full'
      become: true

    - name: Apply SSH Hardening
      block:
        - name: Apply SSH Hardening
          ansible.builtin.include_role:
            name: dev-sec.ssh-hardening
      ignore_errors: "{{ is_sandbox_jules }}"
      when: asimp_privilege_level == 'full'
      become: true

    - name: Apply Lynis Hardening Configuration
      block:
        - name: Apply Lynis Hardening Configuration
          ansible.builtin.include_role:
            name: lynis-ansible
          vars:
            lynis_use_packages: true
            lynis_audit_system_linux: true
      ignore_errors: "{{ is_sandbox_jules }}"
      when: asimp_privilege_level == 'full'
      become: true

    - name: Run AFTER Hardening Audits (OpenSCAP & Lynis)
      block:
        - name: Run AFTER Hardening Audits (OpenSCAP & Lynis)
          ansible.builtin.include_role:
            name: reporting-ASIMP
          vars:
            reporting_phase: after
      become: "{{ asimp_privilege_level == 'full' }}"
