---
# talk to all hosts just so we can learn about them
- name: Discover and group hosts
  hosts: all
  tasks:
    - name: Group by OS family
      ansible.builtin.group_by:
        key: os_{{ ansible_distribution }}

- name: Run ASIMP Security Hardening and Audits
  hosts: os_Ubuntu:os_Debian:os_CentOS:os_RedHat:os_Rocky
  gather_facts: true
  become: true
  vars:
    security_enable_firewalld: false
    security_contrib_enabled: true
    security_ntp_servers:
      - ntp1.sirim.my
      - ntp2.sirim.my
    ssh_kex:
      - curve25519-sha256@libssh.org
      - diffie-hellman-group-exchange-sha256
  tasks:
    - name: Detect if running in Google Jules Sandbox
      ansible.builtin.stat:
        path: /home/jules
      register: jules_home_stat

    - name: Set sandbox fact
      ansible.builtin.set_fact:
        is_sandbox_jules: "{{ jules_home_stat.stat.exists }}"
        security_rhel7_initialize_aide: "{{ not jules_home_stat.stat.exists }}"

    - name: Dynamically patch external roles for sandbox compatibility
      block:
        - name: Patch opensshd.conf.j2 template quotes
          ansible.builtin.replace:
            path: "{{ item }}"
            regexp: '#jinja2: trim_blocks: "true", lstrip_blocks: "true"'
            replace: '#jinja2: trim_blocks: True, lstrip_blocks: True'
          loop:
            - "roles/dev-sec.ssh-hardening/templates/opensshd.conf.j2"
            - "roles/dev-sec.ssh-hardening/templates/openssh.conf.j2"

        - name: Patch dev-sec.ssh-hardening moduli conditional
          ansible.builtin.replace:
            path: "roles/dev-sec.ssh-hardening/tasks/hardening.yml"
            regexp: '- sshd_register_moduli.stdout'
            replace: '- sshd_register_moduli.stdout | length > 0'

        - name: Patch ansible-hardening service tasks (auditd)
          ansible.builtin.replace:
            path: "roles/ansible-hardening/tasks/rhel7stig/auditd.yml"
            regexp: 'name: auditd\n    state: started\n    enabled: true'
            replace: "name: auditd\n    state: started\n    enabled: true\n  ignore_errors: \"{{ '{{' }} is_sandbox_jules | default(false) {{ '}}' }}\""

        - name: Patch ansible-hardening service tasks (autofs)
          ansible.builtin.replace:
            path: "roles/ansible-hardening/tasks/rhel7stig/misc.yml"
            regexp: 'name: autofs\n    state: stopped\n    enabled: false'
            replace: "name: autofs\n    state: stopped\n    enabled: false\n  ignore_errors: \"{{ '{{' }} is_sandbox_jules | default(false) {{ '}}' }}\""

        - name: Patch ansible-hardening service tasks (clamav)
          ansible.builtin.replace:
            path: "roles/ansible-hardening/tasks/rhel7stig/misc.yml"
            regexp: 'name: "{{ "{{ clamav_service }}" }}"\n    state: started\n    enabled: true'
            replace: "name: \"{{ '{{' }} clamav_service {{ '}}' }}\"\n    state: started\n    enabled: true\n  ignore_errors: \"{{ '{{' }} is_sandbox_jules | default(false) {{ '}}' }}\""

        - name: Patch ansible-hardening service tasks (chrony)
          ansible.builtin.replace:
            path: "roles/ansible-hardening/tasks/rhel7stig/misc.yml"
            regexp: 'name: "{{ "{{ chrony_service }}" }}"\n    state: started\n    enabled: true'
            replace: "name: \"{{ '{{' }} chrony_service {{ '}}' }}\"\n    state: started\n    enabled: true\n  ignore_errors: \"{{ '{{' }} is_sandbox_jules | default(false) {{ '}}' }}\""

        - name: Patch ansible-hardening service tasks (firewalld)
          ansible.builtin.replace:
            path: "roles/ansible-hardening/tasks/rhel7stig/misc.yml"
            regexp: 'name: firewalld\n    state: started\n    enabled: true'
            replace: "name: firewalld\n    state: started\n    enabled: true\n  ignore_errors: \"{{ '{{' }} is_sandbox_jules | default(false) {{ '}}' }}\""

        - name: Patch ansible-hardening handlers (restart auditd)
          ansible.builtin.replace:
            path: "roles/ansible-hardening/handlers/main.yml"
            regexp: 'service auditd restart'
            replace: "service auditd restart\n  ignore_errors: \"{{ '{{' }} is_sandbox_jules | default(false) {{ '}}' }}\""

        - name: Patch ansible-hardening handlers (restart chrony)
          ansible.builtin.replace:
            path: "roles/ansible-hardening/handlers/main.yml"
            regexp: 'name: "{{ "{{ chrony_service }}" }}"\n    state: restarted'
            replace: "name: \"{{ '{{' }} chrony_service {{ '}}' }}\"\n    state: restarted\n  ignore_errors: \"{{ '{{' }} is_sandbox_jules | default(false) {{ '}}' }}\""

        - name: Patch ansible-hardening handlers (restart ssh)
          ansible.builtin.replace:
            path: "roles/ansible-hardening/handlers/main.yml"
            regexp: 'name: "{{ "{{ ssh_service }}" }}"\n    state: restarted'
            replace: "name: \"{{ '{{' }} ssh_service {{ '}}' }}\"\n    state: restarted\n  ignore_errors: \"{{ '{{' }} is_sandbox_jules | default(false) {{ '}}' }}\""

        - name: Patch ansible-hardening handlers (restart clamav)
          ansible.builtin.replace:
            path: "roles/ansible-hardening/handlers/main.yml"
            regexp: 'name: "{{ "{{ clamav_service }}" }}"\n    state: restarted'
            replace: "name: \"{{ '{{' }} clamav_service {{ '}}' }}\"\n    state: restarted\n  ignore_errors: \"{{ '{{' }} is_sandbox_jules | default(false) {{ '}}' }}\""

        - name: Patch ansible-hardening handlers (generate rules)
          ansible.builtin.replace:
            path: "roles/ansible-hardening/handlers/main.yml"
            regexp: 'augenrules --load'
            replace: "augenrules --load\n  ignore_errors: \"{{ '{{' }} is_sandbox_jules | default(false) {{ '}}' }}\""
      delegate_to: localhost
      run_once: true
      failed_when: false
      tags: always

    - name: Patch lynis-ansible tasks to use include_tasks on-the-fly
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^(\s*)include:'
        replace: '\1ansible.builtin.include_tasks:'
      loop:
        - "roles/lynis-ansible/tasks/main.yml"
        - "roles/linuxmalaysia.lynis_ansible/tasks/main.yml"
        - "{{ lookup('env', 'HOME') }}/.ansible/roles/linuxmalaysia.lynis_ansible/tasks/main.yml"
        - "/usr/share/ansible/roles/linuxmalaysia.lynis_ansible/tasks/main.yml"
        - "/etc/ansible/roles/linuxmalaysia.lynis_ansible/tasks/main.yml"
      delegate_to: localhost
      run_once: true
      failed_when: false
      tags: always

    - name: Run BEFORE Hardening Audits (OpenSCAP & Lynis)
      ansible.builtin.include_role:
        name: reporting-ASIMP
      vars:
        reporting_phase: before

    - name: Apply Ubuntu Update Hardening
      ansible.builtin.include_role:
        name: update-ubuntu-ASIMP
      vars:
        upgrade_ubuntu_check: "{{ not is_sandbox_jules }}"
        dist_upgrade_ubuntu_check: "{{ not is_sandbox_jules }}"
        safe_upgrade_ubuntu_check: "{{ not is_sandbox_jules }}"
        debsums_ubuntu_check: "{{ not is_sandbox_jules }}"
      when: ansible_distribution == 'Ubuntu' or ansible_os_family == 'Debian'

    - name: Apply OpenStack System Hardening
      ansible.builtin.include_role:
        name: ansible-hardening
      ignore_errors: "{{ is_sandbox_jules }}"

    - name: Apply SSH Hardening
      ansible.builtin.include_role:
        name: dev-sec.ssh-hardening
      ignore_errors: "{{ is_sandbox_jules }}"

    - name: Apply Lynis Hardening Configuration
      ansible.builtin.include_role:
        name: lynis-ansible
      vars:
        lynis_use_packages: true
        lynis_audit_system_linux: true
      ignore_errors: "{{ is_sandbox_jules }}"

    - name: Run AFTER Hardening Audits (OpenSCAP & Lynis)
      ansible.builtin.include_role:
        name: reporting-ASIMP
      vars:
        reporting_phase: after
