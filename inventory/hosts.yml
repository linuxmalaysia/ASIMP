all:
  vars:
    # Mode Separation: default to 'user' mode for safety, override with 'dev' as needed
    execution_mode: "user"
    pr_id: "none"
    asimp_privilege_level: "limited"
  children:
    matrix_hosts:
      hosts:
        ubuntu24:
          ansible_host: ubuntu24_test
          ansible_connection: podman
          os_distro: ubuntu
          os_version: "24.04"
          image: "docker.io/library/ubuntu:24.04"
        ubuntu26:
          ansible_host: ubuntu26_test
          ansible_connection: podman
          os_distro: ubuntu
          os_version: "26.04"
          image: "docker.io/library/ubuntu:26.04"
        alma9:
          ansible_host: alma9_test
          ansible_connection: podman
          os_distro: almalinux
          os_version: "9"
          image: "docker.io/library/almalinux:9"
        debian12:
          ansible_host: debian12_test
          ansible_connection: podman
          os_distro: debian
          os_version: "12"
          image: "docker.io/library/debian:12"
