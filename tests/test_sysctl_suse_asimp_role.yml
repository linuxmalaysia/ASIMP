---
- name: Test sysctl-suse-ASIMP role structure and calculation logic
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    repo_root: "{{ playbook_dir }}/.."
    role_templates_dir: "{{ repo_root }}/roles/sysctl-suse-ASIMP/templates"
  tasks:
    - name: Load sysctl-suse-ASIMP defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/sysctl-suse-ASIMP/defaults/main.yml"
        name: sysctl_defaults

    - name: Assert defaults are properly configured
      ansible.builtin.assert:
        that:
          - sysctl_defaults.suse_sysctl_config_file == '/etc/sysctl.d/99-suse-network-hardening.conf'
          - sysctl_defaults.suse_sysctl_auto_calc_resources == true
        fail_msg: "sysctl-suse-ASIMP defaults are invalid"

    - name: Test Base Branch (small RAM, low vCPU -> base 4096 / 1024)
      ansible.builtin.include_role:
        name: sysctl-suse-ASIMP
      vars:
        asimp_privilege_level: limited
        is_sandbox_jules: true
        suse_sysctl_auto_calc_resources: true
        ansible_facts:
          memtotal_mb: 512
          processor_vcpus: 1
          mounts:
            - mount: /
              size_total: 10737418240

    - name: Assert Base Branch constant outputs
      ansible.builtin.assert:
        that:
          - suse_sysctl_tcp_max_syn_backlog_calc | int == 4096
          - suse_sysctl_somaxconn_calc | int == 1024
        fail_msg: "Base calculation branch constant assertion failed"

    - name: Test RAM-Dominant Branch (high RAM 8192MB, 2 vCPUs)
      ansible.builtin.include_role:
        name: sysctl-suse-ASIMP
      vars:
        asimp_privilege_level: limited
        is_sandbox_jules: true
        suse_sysctl_auto_calc_resources: true
        ansible_facts:
          memtotal_mb: 8192
          processor_vcpus: 2
          mounts:
            - mount: /
              size_total: 21474836480

    - name: Assert RAM-Dominant constant outputs
      ansible.builtin.assert:
        that:
          - suse_sysctl_tcp_max_syn_backlog_calc | int == 32768
          - suse_sysctl_somaxconn_calc | int == 8192
        fail_msg: "RAM-dominant calculation branch constant assertion failed"

    - name: Test vCPU-Dominant Branch (low RAM 1024MB, high 16 vCPUs)
      ansible.builtin.include_role:
        name: sysctl-suse-ASIMP
      vars:
        asimp_privilege_level: limited
        is_sandbox_jules: true
        suse_sysctl_auto_calc_resources: true
        ansible_facts:
          memtotal_mb: 1024
          processor_vcpus: 16
          mounts:
            - mount: /
              size_total: 21474836480

    - name: Assert vCPU-Dominant constant outputs
      ansible.builtin.assert:
        that:
          - suse_sysctl_tcp_max_syn_backlog_calc | int == 32768
          - suse_sysctl_somaxconn_calc | int == 8192
        fail_msg: "vCPU-dominant calculation branch constant assertion failed"

    - name: Test disabled auto-calculation mode (suse_sysctl_auto_calc_resources = false)
      ansible.builtin.include_role:
        name: sysctl-suse-ASIMP
      vars:
        asimp_privilege_level: limited
        is_sandbox_jules: true
        suse_sysctl_auto_calc_resources: false
        suse_sysctl_override_tcp_max_syn_backlog: null
        suse_sysctl_override_somaxconn: null

    - name: Assert exact non-auto fixed fallback defaults when auto-calculation is disabled
      ansible.builtin.assert:
        that:
          - suse_sysctl_tcp_max_syn_backlog_calc | int == 4096
          - suse_sysctl_somaxconn_calc | int == 1024
        fail_msg: "Disabled auto-calculation mode failed fallback assertion"

    - name: Test explicit parameter overrides
      ansible.builtin.include_role:
        name: sysctl-suse-ASIMP
      vars:
        asimp_privilege_level: limited
        is_sandbox_jules: true
        suse_sysctl_override_tcp_max_syn_backlog: 16384
        suse_sysctl_override_somaxconn: 8192

    - name: Assert explicit override limits are respected exactly
      ansible.builtin.assert:
        that:
          - suse_sysctl_tcp_max_syn_backlog_calc | int == 16384
          - suse_sysctl_somaxconn_calc | int == 8192
        fail_msg: "Explicit parameter overrides were not applied"

    - name: Test explicit override of exactly 0 (must be distinguished from "unset")
      ansible.builtin.include_role:
        name: sysctl-suse-ASIMP
      vars:
        asimp_privilege_level: limited
        is_sandbox_jules: true
        suse_sysctl_override_tcp_max_syn_backlog: 0
        suse_sysctl_override_somaxconn: 0

    - name: Assert an explicit override of 0 is honored rather than falling back to auto-calc/defaults
      ansible.builtin.assert:
        that:
          - suse_sysctl_tcp_max_syn_backlog_calc | int == 0
          - suse_sysctl_somaxconn_calc | int == 0
        fail_msg: "An explicit override value of 0 must be respected (it is 'not none'), not treated as unset"

    - name: Test missing hardware facts (ansible_facts provides none of the expected keys)
      ansible.builtin.include_role:
        name: sysctl-suse-ASIMP
      vars:
        asimp_privilege_level: limited
        is_sandbox_jules: true
        suse_sysctl_auto_calc_resources: true
        ansible_facts: {}

    - name: Assert node resource facts fall back to their documented defaults when hardware facts are absent
      ansible.builtin.assert:
        that:
          - suse_sysctl_node_mem_mb | int == 1024
          - suse_sysctl_node_vcpus | int == 1
          - suse_sysctl_node_disk_gb | float == 10.0
          - suse_sysctl_tcp_max_syn_backlog_calc | int == 4096
          - suse_sysctl_somaxconn_calc | int == 1024
        fail_msg: "Missing memtotal_mb/processor_vcpus/mounts facts must fall back to 1024MB RAM, 1 vCPU, and a 10GB default root disk size"

    - name: Test root disk size telemetry with a custom mount size (5GB)
      ansible.builtin.include_role:
        name: sysctl-suse-ASIMP
      vars:
        asimp_privilege_level: limited
        is_sandbox_jules: true
        ansible_facts:
          memtotal_mb: 2048
          processor_vcpus: 2
          mounts:
            - mount: /boot
              size_total: 1073741824
            - mount: /
              size_total: 5368709120

    - name: Assert the root disk size is read from the '/' mount entry specifically, not the first mount in the list
      ansible.builtin.assert:
        that:
          - suse_sysctl_node_disk_gb | float == 5.0
        fail_msg: "suse_sysctl_node_disk_gb must be derived from the mount entry whose 'mount' is exactly '/', ignoring other mounts such as /boot"

    - name: Load sysctl-suse-ASIMP role metadata
      ansible.builtin.set_fact:
        sysctl_meta: "{{ lookup('file', repo_root + '/roles/sysctl-suse-ASIMP/meta/main.yml') | from_yaml }}"

    - name: Assert the role's galaxy_info metadata is correctly declared
      ansible.builtin.assert:
        that:
          - sysctl_meta.galaxy_info.author == 'ASIMP Team'
          - sysctl_meta.galaxy_info.license == 'GPL-3.0-only'
          - sysctl_meta.galaxy_info.min_ansible_version == "2.14"
          - sysctl_meta.galaxy_info.platforms | length == 1
          - sysctl_meta.galaxy_info.platforms[0].name == 'GenericLinux'
          - sysctl_meta.galaxy_info.platforms[0].versions == ['all']
        fail_msg: "roles/sysctl-suse-ASIMP/meta/main.yml galaxy_info metadata is missing or was changed unexpectedly"

    - name: Assert the role declares no external dependencies
      ansible.builtin.assert:
        that:
          - sysctl_meta.dependencies == []
        fail_msg: "roles/sysctl-suse-ASIMP/meta/main.yml must declare an empty dependencies list"

    # --- Template rendering (safe: renders in-memory only, never writes to /etc) ---
    - name: Render the network hardening sysctl template with a fixed set of calculated facts
      ansible.builtin.set_fact:
        suse_sysctl_node_mem_mb: "2048"
        suse_sysctl_node_vcpus: "4"
        suse_sysctl_node_disk_gb: "20.0"
        suse_sysctl_tcp_max_syn_backlog_calc: "8192"
        suse_sysctl_somaxconn_calc: "2048"

    - name: Render the template via the template lookup plugin
      ansible.builtin.set_fact:
        rendered_sysctl_conf: "{{ lookup('template', role_templates_dir + '/99-suse-network-hardening.conf.j2') }}"

    - name: Assert the rendered template embeds the calculated backlog and connection limits
      ansible.builtin.assert:
        that:
          - "'net.ipv4.tcp_max_syn_backlog = 8192' in rendered_sysctl_conf"
          - "'net.core.somaxconn = 2048' in rendered_sysctl_conf"
        fail_msg: "The rendered sysctl template must embed the calculated tcp_max_syn_backlog and somaxconn values"

    - name: Assert the rendered template's header comment reports the exact node specs
      ansible.builtin.assert:
        that:
          - "'Node Specs: 2048 MB RAM | 4 vCPUs | 20.0 GB Disk' in rendered_sysctl_conf"
        fail_msg: "The rendered sysctl template header must report the node's RAM, vCPU, and disk telemetry"

    - name: Assert every fixed (non-calculated) hardening directive is present with its documented value
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.default.rp_filter = 1' in rendered_sysctl_conf"
          - "'net.ipv4.conf.all.rp_filter = 1' in rendered_sysctl_conf"
          - "'net.ipv4.conf.default.accept_source_route = 0' in rendered_sysctl_conf"
          - "'net.ipv4.conf.all.accept_source_route = 0' in rendered_sysctl_conf"
          - "'net.ipv4.tcp_syncookies = 1' in rendered_sysctl_conf"
          - "'net.ipv4.icmp_echo_ignore_broadcasts = 1' in rendered_sysctl_conf"
          - "'net.ipv4.icmp_ignore_bogus_error_responses = 1' in rendered_sysctl_conf"
          - "'net.ipv4.conf.default.accept_redirects = 0' in rendered_sysctl_conf"
          - "'net.ipv4.conf.all.accept_redirects = 0' in rendered_sysctl_conf"
          - "'net.ipv6.conf.default.accept_redirects = 0' in rendered_sysctl_conf"
          - "'net.ipv6.conf.all.accept_redirects = 0' in rendered_sysctl_conf"
          - "'net.ipv4.conf.default.secure_redirects = 0' in rendered_sysctl_conf"
          - "'net.ipv4.conf.all.secure_redirects = 0' in rendered_sysctl_conf"
          - "'net.ipv4.conf.default.send_redirects = 0' in rendered_sysctl_conf"
          - "'net.ipv4.conf.all.send_redirects = 0' in rendered_sysctl_conf"
          - "'net.ipv4.ip_forward = 0' in rendered_sysctl_conf"
          - "'net.ipv6.conf.all.forwarding = 0' in rendered_sysctl_conf"
          - "'net.ipv6.conf.default.forwarding = 0' in rendered_sysctl_conf"
          - "'net.ipv4.conf.all.log_martians = 1' in rendered_sysctl_conf"
          - "'net.ipv4.conf.default.log_martians = 1' in rendered_sysctl_conf"
        fail_msg: "The rendered sysctl template is missing one or more of the SLED 15 SP7 network hardening directives"

    - name: Assert the rendered template contains exactly 22 sysctl directives with no duplicates
      ansible.builtin.assert:
        that:
          - (rendered_sysctl_conf | regex_findall('(?m)^net\\.')) | length == 22
        fail_msg: "The rendered sysctl template must define exactly 22 unique 'net.*' directives, matching the documented reference table"
