---
# Structural regression tests for update-ubuntu-ASIMP role tasks.
#
# These tests parse and assert the tasks, handlers, modules, conditional gates,
# loop structures, and async parameters inside roles/update-ubuntu-ASIMP/tasks/
# files, ensuring they remain robust and comply with ASIMP FQCN and testing standards.
#
# Run with:
#   ansible-playbook -i tests/inventory tests/test_update_ubuntu_asimp_tasks.yml
- name: Verify update-ubuntu-ASIMP role tasks structure and integrity
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    role_tasks_dir: "{{ repo_root }}/roles/update-ubuntu-ASIMP/tasks"
    expected_os_when: "ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'"
    expected_updaterepo_jid: "{% raw %}{{ updaterepo_sleeper.ansible_job_id }}{% endraw %}"
    expected_upgrade_jid: "{% raw %}{{ upgrade_sleeper.ansible_job_id }}{% endraw %}"
    expected_debsums_jid: "{% raw %}{{ debsums_sleeper.ansible_job_id }}{% endraw %}"
    expected_rpmsums_jid: "{% raw %}{{ rpmsums_sleeper.ansible_job_id }}{% endraw %}"

  tasks:
    - name: Load tasks/main.yml
      ansible.builtin.set_fact:
        main_tasks: "{{ lookup('file', role_tasks_dir + '/main.yml') | from_yaml }}"

    - name: Load tasks/upgrade-packages.yml
      ansible.builtin.set_fact:
        upgrade_tasks: "{{ lookup('file', role_tasks_dir + '/upgrade-packages.yml') | from_yaml }}"

    - name: Load tasks/debsums-check.yml
      ansible.builtin.set_fact:
        debsums_tasks: "{{ lookup('file', role_tasks_dir + '/debsums-check.yml') | from_yaml }}"

    - name: Load tasks/rpmsums-check.yml
      ansible.builtin.set_fact:
        rpmsums_tasks: "{{ lookup('file', role_tasks_dir + '/rpmsums-check.yml') | from_yaml }}"

    - name: Build task-by-name lookups
      ansible.builtin.set_fact:
        main_tasks_by_name: "{{ dict(main_tasks | map(attribute='name') | zip(main_tasks)) }}"
        upgrade_tasks_by_name: "{{ dict(upgrade_tasks | map(attribute='name') | list | zip(upgrade_tasks)) }}"
        debsums_tasks_by_name: "{{ dict(debsums_tasks | map(attribute='name') | list | zip(debsums_tasks)) }}"
        rpmsums_tasks_by_name: "{{ dict(rpmsums_tasks | map(attribute='name') | list | zip(rpmsums_tasks)) }}"

    # --- Verify tasks/main.yml -----------------------------------------

    - name: Assert core tasks exist in main.yml
      ansible.builtin.assert:
        that:
          - "'Update repositories cache' in main_tasks_by_name"
          - "'Update repositories cache - check on async task' in main_tasks_by_name"
          - "'Run package upgrades' in main_tasks_by_name"
          - "'Download apt-transport-https for apt using https' in main_tasks_by_name"
          - "'Install the package debsums for installed packages verification' in main_tasks_by_name"
          - "'Remove useless packages from the cache' in main_tasks_by_name"
          - "'Remove dependencies that are no longer required' in main_tasks_by_name"
          - "'Run debsums check' in main_tasks_by_name"
        fail_msg: "One or more expected tasks is missing from roles/update-ubuntu-ASIMP/tasks/main.yml"

    - name: Assert 'Update repositories cache' is fully compliant
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.apt' in main_tasks_by_name['Update repositories cache']"
          - main_tasks_by_name['Update repositories cache']['ansible.builtin.apt'].update_cache == true
          - main_tasks_by_name['Update repositories cache'].async == 360
          - main_tasks_by_name['Update repositories cache'].poll == 0
          - main_tasks_by_name['Update repositories cache'].register == 'updaterepo_sleeper'
          - main_tasks_by_name['Update repositories cache'].when == expected_os_when
          - main_tasks_by_name['Update repositories cache'].tags == 'apt'
        fail_msg: "'Update repositories cache' task lacks correct module, async parameters, or conditional check."

    - name: Assert 'Update repositories cache - check on async task' is fully compliant
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.async_status' in main_tasks_by_name['Update repositories cache - check on async task']"
          - main_tasks_by_name['Update repositories cache - check on async task']['ansible.builtin.async_status'].jid == expected_updaterepo_jid
          - main_tasks_by_name['Update repositories cache - check on async task'].register == 'updaterepo_job_result'
          - main_tasks_by_name['Update repositories cache - check on async task'].until == 'updaterepo_job_result.finished'
          - main_tasks_by_name['Update repositories cache - check on async task'].delay == 10
          - main_tasks_by_name['Update repositories cache - check on async task'].retries == 36
          - main_tasks_by_name['Update repositories cache - check on async task'].when == expected_os_when
        fail_msg: "The async status check task for updaterepo has incorrect parameters."

    - name: Assert 'Run package upgrades' task is fully compliant
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.include_tasks' in main_tasks_by_name['Run package upgrades']"
          - main_tasks_by_name['Run package upgrades']['ansible.builtin.include_tasks'] == 'upgrade-packages.yml'
          - main_tasks_by_name['Run package upgrades'].loop_control.loop_var == 'upgrade_item'
          - main_tasks_by_name['Run package upgrades'].tags == 'apt'
        fail_msg: "'Run package upgrades' task has invalid structure, inclusion, or tags."

    - name: Assert debsums check installation and inclusion tasks are gated
      ansible.builtin.assert:
        that:
          - "'debsums_ubuntu_check' in main_tasks_by_name['Install the package debsums for installed packages verification'].when"
          - "'debsums_ubuntu_check' in main_tasks_by_name['Run debsums check'].when"
          - main_tasks_by_name['Install the package debsums for installed packages verification'].ignore_errors == true
          - main_tasks_by_name['Run debsums check'].ignore_errors == true
          - main_tasks_by_name['Install the package debsums for installed packages verification'].tags == 'debsums'
          - main_tasks_by_name['Run debsums check'].tags == 'debsums'
        fail_msg: "Debsums installation/check tasks must be appropriately gated on debsums_ubuntu_check, carry ignore_errors, and tagged 'debsums'."

    # --- Verify tasks/upgrade-packages.yml -----------------------------

    - name: Assert core tasks exist in upgrade-packages.yml
      ansible.builtin.assert:
        that:
          - upgrade_tasks | length == 2
        fail_msg: "upgrade-packages.yml must contain exactly two tasks."

    - name: Verify upgrade task parameters inside upgrade-packages.yml
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.apt' in upgrade_tasks[0]"
          - upgrade_tasks[0]['ansible.builtin.apt'].force_apt_get == true
          - upgrade_tasks[0].async == 360
          - upgrade_tasks[0].poll == 0
          - upgrade_tasks[0].register == 'upgrade_sleeper'
          - upgrade_tasks[0].tags == 'apt'
        fail_msg: "The package upgrade task inside upgrade-packages.yml lacks correct FQCN, force_apt_get, async settings, or tags."

    - name: Verify async status check task parameters inside upgrade-packages.yml
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.async_status' in upgrade_tasks[1]"
          - upgrade_tasks[1]['ansible.builtin.async_status'].jid == expected_upgrade_jid
          - upgrade_tasks[1].register == 'upgrade_job_result'
          - upgrade_tasks[1].until == 'upgrade_job_result.finished'
          - upgrade_tasks[1].delay == 10
          - upgrade_tasks[1].retries == 36
        fail_msg: "The async status check task inside upgrade-packages.yml lacks correct FQCN, job registration, or retry limits."

    # --- Verify tasks/debsums-check.yml --------------------------------

    - name: Assert core tasks exist in debsums-check.yml
      ansible.builtin.assert:
        that:
          - debsums_tasks | length == 3
        fail_msg: "debsums-check.yml must contain exactly three tasks (safety check, debsums execution, and async check status)."

    - name: Verify debsums binary check (safety check) inside debsums-check.yml
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.command' in debsums_tasks[0]"
          - debsums_tasks[0]['ansible.builtin.command'] == 'which debsums'
          - debsums_tasks[0].register == 'r_debsums_binary_check'
          - debsums_tasks[0].changed_when == false
          - debsums_tasks[0].failed_when == false
          - debsums_tasks[0].tags == 'debsums'
        fail_msg: "The debsums availability safety check task is misconfigured."

    - name: Verify debsums run task parameters inside debsums-check.yml
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.command' in debsums_tasks[1]"
          - debsums_tasks[1]['ansible.builtin.command'] == 'debsums -c'
          - debsums_tasks[1].async == 360
          - debsums_tasks[1].poll == 0
          - debsums_tasks[1].register == 'debsums_sleeper'
          - debsums_tasks[1].tags == 'debsums'
          - debsums_tasks[1].ignore_errors == true
          - debsums_tasks[1].changed_when == false
          - "'debsums_ubuntu_check' in debsums_tasks[1].when"
          - "'/var/log' not in debsums_tasks[1]['ansible.builtin.command']"
        fail_msg: "The debsums run task must use ansible.builtin.command, carry changed_when: false, avoid direct /var/log redirection, and require debsums_ubuntu_check."

    - name: Verify debsums status check task parameters inside debsums-check.yml
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.async_status' in debsums_tasks[2]"
          - debsums_tasks[2]['ansible.builtin.async_status'].jid == expected_debsums_jid
          - debsums_tasks[2].register == 'debsums_job_result'
          - debsums_tasks[2].until == 'debsums_job_result.finished'
          - debsums_tasks[2].delay == 10
          - debsums_tasks[2].retries == 36
          - "'debsums_ubuntu_check' in debsums_tasks[2].when"
        fail_msg: "The debsums async status task inside debsums-check.yml lacks correct FQCN, job registration, or retry limits."

    - name: Assert RHEL core tasks exist in main.yml
      ansible.builtin.assert:
        that:
          - "'Update RHEL repositories cache' in main_tasks_by_name"
          - "'Update RHEL repositories cache - check on async task' in main_tasks_by_name"
          - "'Run RHEL package upgrades' in main_tasks_by_name"
          - "'Run RHEL package upgrades - check on async task' in main_tasks_by_name"
          - "'Run rpmsums check' in main_tasks_by_name"
        fail_msg: "One or more expected RedHat tasks is missing from roles/update-ubuntu-ASIMP/tasks/main.yml"

    - name: Assert 'Update RHEL repositories cache' is fully compliant
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.dnf' in main_tasks_by_name['Update RHEL repositories cache']"
          - main_tasks_by_name['Update RHEL repositories cache']['ansible.builtin.dnf'].update_cache == true
          - main_tasks_by_name['Update RHEL repositories cache'].async == 360
          - main_tasks_by_name['Update RHEL repositories cache'].poll == 0
          - main_tasks_by_name['Update RHEL repositories cache'].register == 'updaterepo_rhel_sleeper'
          - main_tasks_by_name['Update RHEL repositories cache'].when == "ansible_os_family == 'RedHat'"
          - main_tasks_by_name['Update RHEL repositories cache'].tags == 'dnf'
        fail_msg: "'Update RHEL repositories cache' task lacks correct dnf module, async parameters, or conditional check."

    # --- Verify tasks/rpmsums-check.yml --------------------------------

    - name: Assert core tasks exist in rpmsums-check.yml
      ansible.builtin.assert:
        that:
          - rpmsums_tasks | length == 3
        fail_msg: "rpmsums-check.yml must contain exactly three tasks (safety check, rpm verification execution, and async check status)."

    - name: Verify rpm binary check (safety check) inside rpmsums-check.yml
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.command' in rpmsums_tasks[0]"
          - rpmsums_tasks[0]['ansible.builtin.command'] == 'which rpm'
          - rpmsums_tasks[0].register == 'r_rpm_binary_check'
          - rpmsums_tasks[0].changed_when == false
          - rpmsums_tasks[0].failed_when == false
          - rpmsums_tasks[0].tags == 'rpmsums'
        fail_msg: "The rpm availability safety check task is misconfigured."

    - name: Verify rpm verification run task parameters inside rpmsums-check.yml
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.command' in rpmsums_tasks[1]"
          - rpmsums_tasks[1]['ansible.builtin.command'] == 'rpm -Va'
          - rpmsums_tasks[1].async == 360
          - rpmsums_tasks[1].poll == 0
          - rpmsums_tasks[1].register == 'rpmsums_sleeper'
          - rpmsums_tasks[1].tags == 'rpmsums'
          - rpmsums_tasks[1].ignore_errors == true
          - rpmsums_tasks[1].changed_when == false
          - "'rpmsums_check' in rpmsums_tasks[1].when"
        fail_msg: "The rpm verification run task must use ansible.builtin.command, carry changed_when: false, and require rpmsums_check."

    - name: Verify rpm status check task parameters inside rpmsums-check.yml
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.async_status' in rpmsums_tasks[2]"
          - rpmsums_tasks[2]['ansible.builtin.async_status'].jid == expected_rpmsums_jid
          - rpmsums_tasks[2].register == 'rpmsums_job_result'
          - rpmsums_tasks[2].until == 'rpmsums_job_result.finished'
          - rpmsums_tasks[2].delay == 10
          - rpmsums_tasks[2].retries == 36
          - "'rpmsums_check' in rpmsums_tasks[2].when"
        fail_msg: "The rpmsums async status task inside rpmsums-check.yml lacks correct FQCN, job registration, or retry limits."
