---
# tasks file for update-ubuntu-ASIMP
- name: Update repositories cache
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'
  tags: apt
  async: 361
  poll: 0
  register: updaterepo_sleeper

- name: Update repositories cache - check on async task
  ansible.builtin.async_status:
    jid: "{{ updaterepo_sleeper.ansible_job_id }}"
  register: updaterepo_job_result
  until: updaterepo_job_result.finished
  retries: 360
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'

- name: Run package upgrades
  ansible.builtin.include_tasks: upgrade-packages.yml
  loop:
    - name: "Upgrade all packages"
      apt_name: "*"
      state: latest
      enabled: "{{ upgrade_ubuntu_check | default(false) | bool }}"
    - name: "Dist Upgrade all packages"
      upgrade: "dist"
      enabled: "{{ dist_upgrade_ubuntu_check | default(false) | bool }}"
    - name: "Safe Upgrade all packages"
      upgrade: "safe"
      enabled: "{{ safe_upgrade_ubuntu_check | default(false) | bool }}"
  loop_control:
    loop_var: upgrade_item
  when:
    - (ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu')
    - upgrade_item.enabled
  tags: apt

- name: Download apt-transport-https for apt using https
  ansible.builtin.apt:
    name: apt-transport-https
    update_cache: true
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'
  tags: apt
  ignore_errors: true

- name: Install the package debsums for installed packages verification
  ansible.builtin.apt:
    name: debsums
  when:
    - (ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu')
    - debsums_ubuntu_check is defined
    - debsums_ubuntu_check
  tags: debsums
  ignore_errors: true

- name: Remove useless packages from the cache
  ansible.builtin.apt:
    autoclean: true
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'
  tags: apt

- name: Remove dependencies that are no longer required
  ansible.builtin.apt:
    autoremove: true
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'
  tags: apt

- name: Run debsums check
  ansible.builtin.include_tasks: debsums-check.yml
  when:
    - (ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu')
    - debsums_ubuntu_check is defined
    - debsums_ubuntu_check
  tags: debsums
  ignore_errors: true

# --- RedHat Family Tasks (RHEL, Rocky, Alma, Oracle, CentOS) ---

- name: Update RHEL repositories cache
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_os_family == 'RedHat'
  tags: dnf
  async: 361
  poll: 0
  register: updaterepo_rhel_sleeper

- name: Update RHEL repositories cache - check on async task
  ansible.builtin.async_status:
    jid: "{{ updaterepo_rhel_sleeper.ansible_job_id }}"
  register: updaterepo_rhel_job_result
  until: updaterepo_rhel_job_result.finished
  retries: 360
  when: ansible_os_family == 'RedHat'

- name: Run RHEL package upgrades
  ansible.builtin.dnf:
    name: "*"
    state: latest
  async: 361
  poll: 0
  register: upgrade_rhel_sleeper
  when:
    - ansible_os_family == 'RedHat'
    - upgrade_rhel_check is defined
    - upgrade_rhel_check
  tags: dnf

- name: Run RHEL package upgrades - check on async task
  ansible.builtin.async_status:
    jid: "{{ upgrade_rhel_sleeper.ansible_job_id }}"
  register: upgrade_rhel_job_result
  until: upgrade_rhel_job_result.finished
  retries: 360
  when:
    - ansible_os_family == 'RedHat'
    - upgrade_rhel_check is defined
    - upgrade_rhel_check

- name: Run rpmsums check
  ansible.builtin.include_tasks: rpmsums-check.yml
  when:
    - ansible_os_family == 'RedHat'
    - rpmsums_check is defined
    - rpmsums_check
  tags: rpmsums
  ignore_errors: true
