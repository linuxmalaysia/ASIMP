---
# tasks file for update-ubuntu-ASIMP
- name: Update repositories cache
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'
  tags: apt
  async: 361
  poll: 0
  register: updaterepo_sleeper

- name: Update repositories cache - check on async task
  ansible.builtin.async_status:
    jid: "{{ updaterepo_sleeper.ansible_job_id }}"
  register: updaterepo_job_result
  until: updaterepo_job_result.finished
  retries: 360

- name: Upgrade all packages to the latest version
  ansible.builtin.apt:
    name: "*"
    state: latest
    force_apt_get: true
  when:
    - (ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu')
    - upgrade_ubuntu_check is defined
    - upgrade_ubuntu_check
  tags: apt
  async: 361
  poll: 0
  register: updateapt_sleeper

- name: Upgrade all packages - check on async task
  ansible.builtin.async_status:
    jid: "{{ updateapt_sleeper.ansible_job_id }}"
  register: updateapt_job_result
  until: updateapt_job_result.finished
  retries: 360

- name: Dist Upgrade all packages to the latest version
  ansible.builtin.apt:
    upgrade: dist
    force_apt_get: true
  when:
    - (ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu')
    - dist_upgrade_ubuntu_check is defined
    - dist_upgrade_ubuntu_check
  tags: apt
  async: 361
  poll: 0
  register: updateapt2_sleeper

- name: Dist Upgrade all packages - check on async task
  ansible.builtin.async_status:
    jid: "{{ updateapt2_sleeper.ansible_job_id }}"
  register: updateapt2_job_result
  until: updateapt2_job_result.finished
  retries: 360

- name: Safe Upgrade all packages to the latest version
  ansible.builtin.apt:
    upgrade: safe
    force_apt_get: true
  when:
    - (ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu')
    - safe_upgrade_ubuntu_check is defined
    - safe_upgrade_ubuntu_check
  tags: apt
  async: 361
  poll: 0
  register: updateapt3_sleeper

- name: Safe Upgrade all packages - check on async task
  ansible.builtin.async_status:
    jid: "{{ updateapt3_sleeper.ansible_job_id }}"
  register: updateapt3_job_result
  until: updateapt3_job_result.finished
  retries: 360

- name: Download apt-transport-https for apt using https
  ansible.builtin.apt:
    name: apt-transport-https
    update_cache: true
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'
  tags: apt
  ignore_errors: true

- name: Install the package debsums for installed packages verification
  ansible.builtin.apt:
    name: debsums
  when:
    - (ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu')
    - debsums_ubuntu_check is defined
    - debsums_ubuntu_check
  tags: debsums
  ignore_errors: true

- name: Remove useless packages from the cache
  ansible.builtin.apt:
    autoclean: true
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'
  tags: apt

- name: Remove dependencies that are no longer required
  ansible.builtin.apt:
    autoremove: true
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'
  tags: apt

- name: Run debsums check
  ansible.builtin.include_tasks: debsums-check.yml
  when:
    - (ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu')
    - debsums_ubuntu_check is defined
    - debsums_ubuntu_check
  tags: debsums
  ignore_errors: true
